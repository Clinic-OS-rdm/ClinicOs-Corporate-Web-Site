<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínic-Os</title>
<meta name="description" content="Clínic-Os: agenda, pacientes, expediente clínico, receta electrónica y certificados en un mismo sistema.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><circle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22%23F6EFE6%22 stroke=%22%23C2632F%22 stroke-width=%222%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== Clínic-Os — hoja de estilos compartida ===== */
:root{
  --terracota: #C2632F;
  --terracota-dark: #8F4620;
  --sage: #6F8C6A;
  --cream: #F6EFE6;
  --surface: #FFFDF9;
  --alert: #B3412C;
  --ink: #2B2420;
  --ink-soft: #5B5147;
  --line: rgba(43,36,32,.14);
  --line-soft: rgba(43,36,32,.08);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  --shadow-card: 0 18px 40px -24px rgba(43,36,32,.28);
  --radius: 10px;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html,body{ overflow-x:hidden; max-width:100%; }
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }
h1,h2,h3{
  font-family:var(--font-display);
  color:var(--terracota-dark);
  line-height:1.12;
  margin:0 0 .5em;
  font-weight:600;
}
h1{ font-size:clamp(2.1rem, 4.4vw, 3.4rem); font-weight:500; letter-spacing:-.01em; }
h2{ font-size:clamp(1.5rem, 2.6vw, 2.1rem); }
h3{ font-size:1.15rem; }
p{ margin:0 0 1em; color:var(--ink-soft); max-width:62ch; }
.container{ width:100%; max-width:1120px; margin:0 auto; padding:0 24px; }
section{ padding:88px 0; }
.section-tight{ padding:56px 0; }

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--terracota);
  outline-offset:3px;
  border-radius:4px;
}

/* ===== Header / nav ===== */
.site-header{
  position:sticky; top:0; z-index:50;
  background:rgba(246,239,230,.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; max-width:1120px; margin:0 auto;
  overflow:visible;
}
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
.brand svg{ width:34px; height:34px; flex-shrink:0; }
.brand-logo{ width:34px; height:34px; object-fit:contain; flex-shrink:0; }
.brand-word{ font-family:var(--font-display); font-size:1.25rem; color:var(--terracota-dark); font-weight:600; white-space:nowrap; }
.nav-links{ display:flex; align-items:center; gap:30px; list-style:none; margin:0; padding:0; }
.nav-links a{
  text-decoration:none; color:var(--ink-soft); font-size:.95rem;
  padding:6px 2px; border-bottom:2px solid transparent; transition:border-color .18s, color .18s;
  white-space:nowrap;
}
.nav-links a:hover{ color:var(--terracota-dark); }
.nav-links a[aria-current="page"]{ color:var(--terracota-dark); border-bottom-color:var(--terracota); }
.nav-cta{
  display:inline-block; background:var(--terracota); color:var(--surface) !important;
  padding:9px 18px; border-radius:999px; font-size:.9rem; font-weight:500;
  text-decoration:none; flex-shrink:0; transition:background .18s, transform .18s;
}
.nav-cta:hover{ background:var(--terracota-dark); transform:translateY(-1px); }
.nav-right{ display:flex; align-items:center; gap:26px; }

.nav-toggle{
  display:none; flex-shrink:0; width:40px; height:40px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); align-items:center; justify-content:center;
  cursor:pointer;
}
.nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
  content:''; display:block; width:18px; height:2px; background:var(--terracota-dark);
  position:relative; transition:transform .2s, opacity .2s;
}
.nav-toggle span::before{ position:absolute; top:-6px; }
.nav-toggle span::after{ position:absolute; top:6px; }
#nav-check{ display:none; }

@media (max-width:820px){
  .nav-backdrop{
    display:block; position:fixed; inset:0; background:rgba(43,36,32,.32);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:48;
  }
  .nav-links{
    position:absolute; top:100%; left:0; right:0; background:var(--surface);
    flex-direction:column; align-items:flex-start; gap:0;
    max-height:0; overflow:hidden; border-bottom:1px solid var(--line);
    box-shadow:0 18px 32px -18px rgba(43,36,32,.28);
    transition:max-height .28s ease; z-index:49;
  }
  .nav-links a{ width:100%; padding:15px 24px; border-bottom:1px solid var(--line-soft); }
  .nav-links a[aria-current="page"]{ border-bottom:1px solid var(--line-soft); background:rgba(194,99,47,.06); }
  .nav-cta{ display:none; }
  .nav-cta-mobile{ display:none; }
  .nav-toggle{ display:flex; }
  #nav-check:checked ~ .nav-backdrop{ opacity:1; pointer-events:auto; }
  #nav-check:checked ~ .site-header .nav-links{ max-height:480px; }
  #nav-check:checked ~ .site-header .nav-links .nav-cta-mobile{ display:block; padding:16px 24px 20px; }
  #nav-check:checked ~ .site-header .nav-links .nav-cta-mobile a{
    display:block; width:auto; text-align:center; padding:12px; border:none;
    background:var(--terracota); color:var(--surface); border-radius:999px; font-weight:500;
  }
  #nav-check:checked ~ .site-header .nav-right .nav-toggle span{ background:transparent; }
  #nav-check:checked ~ .site-header .nav-right .nav-toggle span::before{ transform:rotate(45deg); top:0; }
  #nav-check:checked ~ .site-header .nav-right .nav-toggle span::after{ transform:rotate(-45deg); top:0; }
}
@media (min-width:821px){
  .nav-backdrop{ display:none; }
  .nav-cta-mobile{ display:none; }
}

/* ===== Buttons ===== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 26px; border-radius:999px; font-size:.95rem; font-weight:500;
  text-decoration:none; cursor:pointer; border:1px solid transparent; font-family:var(--font-body);
  transition:background .18s, color .18s, border-color .18s, transform .18s;
}
.btn-primary{ background:var(--terracota); color:var(--surface); }
.btn-primary:hover{ background:var(--terracota-dark); transform:translateY(-1px); }
.btn-ghost{ background:transparent; color:var(--terracota-dark); border-color:var(--line); }
.btn-ghost:hover{ border-color:var(--terracota); background:rgba(194,99,47,.06); }

/* ===== Hero / laptop animation ===== */
.hero{ padding:0; }
.hero-grid{
  display:grid; grid-template-columns:1.1fr .9fr; gap:56px; align-items:center;
  padding:76px 0 60px;
}
.hero p.lede{ font-size:1.08rem; }
.hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; margin-top:28px; }
.hero-note{ margin-top:26px; font-size:.86rem; color:var(--ink-soft); display:flex; gap:8px; align-items:center; }
.hero-note svg{ flex-shrink:0; width:16px; height:16px; color:var(--sage); }

.laptop{ width:min(420px,100%); margin-inline:auto; }
.laptop-screen{
  background:var(--ink); border-radius:16px 16px 5px 5px; padding:10px 10px 16px;
  box-shadow:var(--shadow-card); transform:rotateX(3deg) rotateY(-5deg); transform-origin:bottom;
}
.laptop-topbar{ display:flex; gap:6px; padding:2px 4px 9px; }
.laptop-topbar span{ width:7px; height:7px; border-radius:50%; background:rgba(246,239,230,.28); }
.laptop-viewport{
  background:var(--cream); border-radius:7px; height:246px; overflow:hidden; position:relative;
  border:1px solid rgba(246,239,230,.08);
}
.laptop-viewport::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, var(--cream) 0%, transparent 14%, transparent 86%, var(--cream) 100%);
}
.laptop-track{ display:flex; flex-direction:column; gap:9px; padding:14px; animation:scrollData 12s linear infinite; }
@keyframes scrollData{ from{ transform:translateY(0); } to{ transform:translateY(-50%); } }
.record-row{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:9px 11px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.record-row .rr-name{ font-size:.82rem; color:var(--ink); }
.record-row .rr-time{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); }
.pill{ font-family:var(--font-mono); font-size:.68rem; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.pill--confirmada{ background:rgba(111,140,106,.16); color:var(--sage); }
.pill--programada{ background:rgba(194,99,47,.14); color:var(--terracota-dark); }
.pill--espera{ background:rgba(143,70,32,.14); color:var(--terracota-dark); }
.pill--curso{ background:rgba(194,99,47,.22); color:var(--terracota-dark); }
.pill--fin{ background:rgba(111,140,106,.22); color:var(--sage); }
.pill--alerta{ background:rgba(179,65,44,.14); color:var(--alert); }
.laptop-base{
  width:112%; margin-left:-6%; height:13px; margin-top:-1px;
  background:linear-gradient(#3a2f26,#221a14); border-radius:0 0 10px 10px;
}
.laptop-cursor{
  position:absolute; width:9px; height:9px; border-radius:50%;
  background:var(--terracota); box-shadow:0 0 0 4px rgba(194,99,47,.18);
  animation:cursorMove 6s ease-in-out infinite;
}
@keyframes cursorMove{
  0%{ top:30px; left:24px; opacity:0; }
  8%{ opacity:1; }
  35%{ top:96px; left:210px; }
  60%{ top:170px; left:70px; }
  85%{ top:170px; left:70px; opacity:1;}
  92%{ opacity:0; }
  100%{ top:30px; left:24px; opacity:0; }
}
@media (prefers-reduced-motion: reduce){
  .laptop-track{ animation:none; }
  .laptop-cursor{ animation:none; display:none; }
}

@media (max-width:900px){
  .hero-grid{ grid-template-columns:1fr; padding-top:44px; text-align:left; }
  .laptop{ margin-top:12px; }
}

/* ===== Module grid ===== */
.eyebrow-title{ max-width:640px; margin-bottom:44px; }
.module-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
}
.module-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px 26px; }
.module-card svg{ width:26px; height:26px; color:var(--terracota); margin-bottom:14px; }
.module-card h3{ color:var(--ink); margin-bottom:8px; }
.module-card p{ font-size:.92rem; margin:0; }
@media (max-width:820px){ .module-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .module-grid{ grid-template-columns:1fr; } }

/* ===== Access sheet (roles) ===== */
.sheet{ border-top:1px solid var(--line); }
.sheet-row{
  display:grid; grid-template-columns:180px 1fr; gap:24px;
  padding:22px 0; border-bottom:1px solid var(--line);
}
.sheet-row .role-tag{
  font-family:var(--font-mono); font-size:.78rem; color:var(--terracota-dark);
  background:rgba(194,99,47,.09); padding:4px 10px; border-radius:6px; height:fit-content;
  white-space:nowrap;
}
.sheet-row p{ margin:0; font-size:.94rem; }
@media (max-width:640px){ .sheet-row{ grid-template-columns:1fr; gap:6px; } }

/* ===== Split media section ===== */
.split{ display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; }
.split.reverse .split-media{ order:2; }
.split-media img{ border-radius:var(--radius); box-shadow:var(--shadow-card); }
.split-media figcaption{ margin-top:12px; font-size:.82rem; color:var(--ink-soft); font-style:italic; }
@media (max-width:840px){ .split, .split.reverse .split-media{ grid-template-columns:1fr; order:0; } }

/* ===== Callout ===== */
.callout{
  border-left:3px solid var(--terracota); background:var(--surface);
  border-radius:0 var(--radius) var(--radius) 0; padding:24px 28px; margin:36px 0;
}
.callout p{ margin:0; color:var(--ink); font-size:.96rem; }
.callout .callout-label{ font-family:var(--font-mono); font-size:.72rem; color:var(--terracota-dark); display:block; margin-bottom:8px; }

/* pillars list */
.pillars{ list-style:none; margin:28px 0 0; padding:0; display:grid; gap:0; }
.pillars li{ padding:16px 0; border-top:1px solid var(--line); display:flex; gap:16px; align-items:flex-start; }
.pillars li:last-child{ border-bottom:1px solid var(--line); }
.pillars svg{ width:18px; height:18px; color:var(--sage); flex-shrink:0; margin-top:3px; }
.pillars strong{ color:var(--ink); display:block; margin-bottom:2px; font-size:.98rem; }
.pillars span.desc{ font-size:.9rem; color:var(--ink-soft); }

/* ===== Doc-style feature sections (Funcionalidades) ===== */
.doc-section{ padding:44px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:260px 1fr; gap:40px; }
.doc-section:first-of-type{ border-top:none; }
.doc-index{ font-family:var(--font-mono); font-size:.78rem; color:var(--terracota); margin-bottom:6px; display:block; }
.doc-section h2{ margin-bottom:10px; }
.feature-list{ list-style:none; margin:18px 0 0; padding:0; display:grid; gap:10px; }
.feature-list li{ font-size:.92rem; color:var(--ink-soft); padding-left:20px; position:relative; }
.feature-list li::before{ content:''; position:absolute; left:0; top:9px; width:6px; height:6px; border-radius:50%; background:var(--terracota); }
.state-row{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
.soap-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-top:18px; }
.soap-grid div{ background:var(--surface); padding:16px; }
.soap-grid .letter{ font-family:var(--font-display); font-size:1.6rem; color:var(--terracota); display:block; margin-bottom:6px; }
.soap-grid p{ font-size:.82rem; margin:0; }
@media (max-width:800px){ .doc-section{ grid-template-columns:1fr; gap:14px; } .soap-grid{ grid-template-columns:1fr 1fr; } }

/* ===== Pricing / packages ===== */
.plan-head{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:0; border-bottom:2px solid var(--ink); }
.plan-head > div{ padding:20px 18px; }
.plan-head h3{ margin-bottom:6px; font-size:1.05rem; }
.plan-head p{ font-size:.82rem; margin:0; }
.plan-row{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; border-bottom:1px solid var(--line); }
.plan-row > div{ padding:15px 18px; font-size:.88rem; display:flex; align-items:center; }
.plan-row > div:first-child{ color:var(--ink); }
.plan-row .yes{ color:var(--sage); }
.plan-row .yes svg{ width:16px; height:16px; }
.plan-row .no{ color:var(--line); font-size:1.1rem; }
.plan-cta{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; padding-top:22px; }
.plan-cta > div:first-child{}
.plan-cta .btn{ width:100%; }
.plans-table-wrap{ position:relative; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.plans-table-wrap > *{ min-width:640px; }
@media (max-width:700px){ .plans-table-wrap > *{ min-width:600px; } }
.plans-table-wrap::after{
  content:''; position:absolute; top:0; right:0; bottom:0; width:34px;
  background:linear-gradient(to right, transparent, var(--cream));
  pointer-events:none;
}
.table-scroll-hint{ display:none; font-size:.82rem; color:var(--terracota-dark); margin:0 0 10px; }
@media (max-width:700px){ .table-scroll-hint{ display:block; } }

/* ===== CTA band ===== */
.cta-band{
  background:var(--terracota-dark); color:var(--surface); border-radius:16px;
  padding:52px 44px; display:flex; align-items:center; justify-content:space-between; gap:30px; flex-wrap:wrap;
}
.cta-band h2{ color:var(--surface); margin:0; max-width:26ch; }
.cta-band .btn-primary{ background:var(--surface); color:var(--terracota-dark); }
.cta-band .btn-primary:hover{ background:var(--cream); }

/* ===== Contact form ===== */
.contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:60px; }
.field{ margin-bottom:18px; }
.field label{ display:block; font-size:.84rem; color:var(--ink); margin-bottom:6px; font-weight:500; }
.field input, .field textarea, .field select{
  width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); font-family:var(--font-body); font-size:.95rem; color:var(--ink);
}
.field textarea{ min-height:120px; resize:vertical; }
.contact-info-item{ display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--line); }
.contact-info-item:last-child{ border-bottom:1px solid var(--line); }
.contact-info-item svg{ width:20px; height:20px; color:var(--terracota); flex-shrink:0; margin-top:2px; }
.contact-info-item strong{ display:block; color:var(--ink); font-size:.94rem; }
.contact-info-item span{ font-size:.88rem; color:var(--ink-soft); }
.form-success{ display:none; background:rgba(111,140,106,.14); color:var(--terracota-dark); padding:14px 16px; border-radius:8px; font-size:.9rem; margin-top:14px; }
.form-success.show{ display:block; }
.form-error{ display:none; background:rgba(179,65,44,.12); color:var(--alert); padding:14px 16px; border-radius:8px; font-size:.9rem; margin-top:14px; }
.form-error.show{ display:block; }
@media (max-width:840px){ .contact-grid{ grid-template-columns:1fr; gap:36px; } }

/* ===== Page hero (non-home) ===== */
.page-hero{ padding:64px 0 28px; }
.page-hero p.lede{ max-width:60ch; }

/* ===== Splash / welcome page ===== */
body.splash-body{ margin:0; }
.splash{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; text-decoration:none; color:inherit;
  -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(circle at 10% 12%, rgba(194,99,47,.32), transparent 30%),
    radial-gradient(circle at 92% 8%, rgba(143,70,32,.22), transparent 26%),
    radial-gradient(circle at 88% 92%, rgba(111,140,106,.30), transparent 32%),
    radial-gradient(circle at 6% 92%, rgba(111,140,106,.20), transparent 28%),
    linear-gradient(135deg, #FBF4EA 0%, #F6EFE6 45%, #F2EBDC 100%);
  background-size: 220% 220%, 220% 220%, 220% 220%, 220% 220%, 200% 200%;
  animation: splashBgShift 26s ease-in-out infinite;
}
@keyframes splashBgShift{
  0%,100%{ background-position: 0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 50%; }
  50%{ background-position: 12% 8%, 88% 10%, 90% 90%, 8% 90%, 100% 50%; }
}
.splash-blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.16; pointer-events:none; }
.splash-blob--a{ width:440px; height:440px; background:var(--terracota); top:-140px; left:-120px; animation:driftA 15s ease-in-out infinite; }
.splash-blob--b{ width:380px; height:380px; background:var(--sage); bottom:-150px; right:-110px; animation:driftB 17s ease-in-out infinite; }
@keyframes driftA{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(36px,26px); } }
@keyframes driftB{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-28px,-34px); } }
.splash-waves{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; filter:blur(2.5px); }
.splash-spotlight{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(circle 380px at var(--mx,50%) var(--my,50%), rgba(255,250,240,.75), rgba(255,250,240,0) 68%);
  opacity: var(--spot-o, .18);
}

.splash-content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px; }
.splash-logo-wrap{
  position:relative; width:168px; height:168px; display:flex; align-items:center; justify-content:center;
  transform-style:preserve-3d; will-change:transform;
}
.splash-ring{
  position:absolute; inset:0; border-radius:50%; border:1px solid rgba(194,99,47,.4);
  opacity:0; animation:splashPulse 2.8s ease-out .9s infinite;
}
.splash-ring--b{ animation-delay:1.85s; }
@keyframes splashPulse{ 0%{ transform:scale(.86); opacity:.5; } 100%{ transform:scale(1.55); opacity:0; } }
.splash-logo{
  width:150px; height:150px; object-fit:contain; opacity:0; position:relative; z-index:2;
  animation:splashLogoIn 1s cubic-bezier(.16,1,.3,1) .05s forwards,
            splashBreathe 4.2s ease-in-out 1.15s infinite;
}
@keyframes splashLogoIn{ from{ opacity:0; transform:scale(.8) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
@keyframes splashBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
.splash-word{
  font-family:var(--font-display); font-weight:500; font-size:clamp(2.1rem,6vw,3.4rem);
  color:var(--terracota-dark); margin:28px 0 6px; opacity:0; animation:splashUp .7s ease .55s forwards;
}
.splash-tag{ font-size:.96rem; color:var(--ink-soft); opacity:0; animation:splashUp .7s ease .72s forwards; margin:0; }
@keyframes splashUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
.splash-enter{
  margin-top:40px; opacity:0; animation:splashUp .7s ease .95s forwards;
  display:inline-flex; align-items:center; gap:8px; font-size:.84rem; color:var(--terracota-dark);
  padding:12px 24px; border:1px solid var(--line); border-radius:999px; background:var(--surface);
  transition:background .2s, border-color .2s;
}
.splash-enter svg{ width:14px; height:14px; transition:transform .2s; }
.splash:hover .splash-enter, .splash:focus-visible .splash-enter{ background:rgba(194,99,47,.09); border-color:var(--terracota); }
.splash:hover .splash-enter svg, .splash:focus-visible .splash-enter svg{ transform:translateX(3px); }
.splash:focus-visible{ outline:2px solid var(--terracota); outline-offset:-4px; }

@media (prefers-reduced-motion: reduce){
  .splash-logo, .splash-word, .splash-tag, .splash-enter{ animation:none !important; opacity:1 !important; transform:none !important; }
  .splash-ring{ display:none; }
  .splash-blob{ animation:none !important; }
}

/* splash exit transition on click */
@keyframes splashLogoOut{
  0%{ transform:scale(1); opacity:1; }
  55%{ opacity:1; }
  100%{ transform:scale(3.6); opacity:0; }
}
@keyframes splashFadeOut{
  0%{ opacity:1; transform:translateY(0); }
  100%{ opacity:0; transform:translateY(-8px); }
}
@keyframes splashBlobOut{
  0%{ transform:scale(1); opacity:.22; }
  100%{ transform:scale(1.55); opacity:0; }
}
.splash.is-leaving .splash-logo{ animation:splashLogoOut .62s cubic-bezier(.4,0,.2,1) forwards; }
.splash.is-leaving .splash-ring{ display:none; }
.splash.is-leaving .splash-word{ animation:splashFadeOut .3s ease forwards; }
.splash.is-leaving .splash-tag{ animation:splashFadeOut .3s ease .03s forwards; }
.splash.is-leaving .splash-enter{ animation:splashFadeOut .26s ease forwards; }
.splash.is-leaving .splash-blob{ animation:splashBlobOut .7s ease forwards; }
.splash.is-leaving{ cursor:progress; }

/* ===== Scroll reveal ===== */
.reveal{ opacity:0; transform:translateY(20px); transition:opacity .65s ease, transform .65s ease; }
@media (prefers-reduced-motion: reduce){
  .reveal{ opacity:1; transform:none; transition:none; }
}
.reveal.is-visible{ opacity:1; transform:translateY(0); }
.module-grid .module-card.reveal:nth-child(1){ transition-delay:.03s; }
.module-grid .module-card.reveal:nth-child(2){ transition-delay:.09s; }
.module-grid .module-card.reveal:nth-child(3){ transition-delay:.15s; }
.module-grid .module-card.reveal:nth-child(4){ transition-delay:.21s; }
.module-grid .module-card.reveal:nth-child(5){ transition-delay:.27s; }
.module-grid .module-card.reveal:nth-child(6){ transition-delay:.33s; }
.sheet .sheet-row.reveal:nth-of-type(1){ transition-delay:.03s; }
.sheet .sheet-row.reveal:nth-of-type(2){ transition-delay:.09s; }
.sheet .sheet-row.reveal:nth-of-type(3){ transition-delay:.15s; }
.sheet .sheet-row.reveal:nth-of-type(4){ transition-delay:.21s; }
.pillars li.reveal:nth-of-type(1){ transition-delay:.03s; }
.pillars li.reveal:nth-of-type(2){ transition-delay:.09s; }
.pillars li.reveal:nth-of-type(3){ transition-delay:.15s; }
.pillars li.reveal:nth-of-type(4){ transition-delay:.21s; }

/* ===== Footer ===== */
.site-footer{ border-top:1px solid var(--line); background:var(--surface); margin-top:40px; }
.footer-top{ display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:40px; padding:56px 0 36px; }
@media (max-width:640px){
  .footer-top{ grid-template-columns:1fr; gap:32px; }
}
.footer-brand{ display:flex; align-items:center; gap:10px; margin-bottom:14px; text-decoration:none; }
.footer-brand svg{ width:28px; height:28px; }
.footer-brand .brand-logo{ width:28px; height:28px; }
.footer-brand span{ font-family:var(--font-display); color:var(--terracota-dark); font-size:1.1rem; }
.footer-col h4{ font-size:.82rem; color:var(--ink); margin:0 0 14px; font-weight:600; }
.footer-col ul{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.footer-col a{ text-decoration:none; color:var(--ink-soft); font-size:.9rem; }
.footer-col a:hover{ color:var(--terracota-dark); }
.footer-bottom{
  border-top:1px solid var(--line); padding:22px 0 30px;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.footer-legal{ font-size:.8rem; color:var(--ink-soft); }
.iwa-credit{
  display:flex; align-items:center; gap:10px; text-decoration:none;
  padding:6px 12px 6px 6px; border-radius:999px; border:1px solid var(--line);
  transition:border-color .18s, background .18s;
}
.iwa-credit:hover{ border-color:var(--terracota); background:rgba(194,99,47,.06); }
.iwa-credit img{ width:26px; height:26px; border-radius:50%; object-fit:cover; }
.iwa-credit span{ font-size:.8rem; color:var(--ink-soft); }
.iwa-credit strong{ color:var(--terracota-dark); font-weight:600; }

</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var form = document.getElementById('contact-form');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var success = document.getElementById('form-success');
      var errorBox = document.getElementById('form-error');
      var submitBtn = document.getElementById('contact-submit');
      var originalLabel = submitBtn ? submitBtn.textContent : '';
      if (errorBox) { errorBox.classList.remove('show'); }
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Enviando…'; }

      var ajaxUrl = form.action.replace('https://formsubmit.co/', 'https://formsubmit.co/ajax/');
      fetch(ajaxUrl, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      }).then(function (res) {
        if (!res.ok) { throw new Error('bad status'); }
        return res.json();
      }).then(function () {
        if (success) { success.classList.add('show'); success.setAttribute('role', 'status'); }
        form.reset();
      }).catch(function () {
        // fall back to a normal form submission if the AJAX endpoint is unreachable
        if (errorBox) { errorBox.classList.add('show'); }
        form.submit();
      }).finally(function () {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
      });
    });
  }

  var splash = document.querySelector('.splash');
  if (splash) {
    splash.addEventListener('click', function (e) {
      if (splash.classList.contains('is-leaving')) { e.preventDefault(); return; }
      e.preventDefault();
      splash.classList.add('is-leaving');
      var dest = splash.getAttribute('href');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () { window.location.href = dest; }, reduced ? 0 : 620);
    });
  }

  initSplashWaves();

  if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(function (el) {
      revealObserver.observe(el);
    });
    // safety net: never leave content permanently invisible for any reason
    setTimeout(function () {
      document.querySelectorAll('.reveal:not(.is-visible)').forEach(function (el) {
        el.classList.add('is-visible');
      });
    }, 2500);
  } else {
    document.querySelectorAll('.reveal').forEach(function (el) {
      el.classList.add('is-visible');
    });
  }
});

function initSplashWaves() {
  var canvas = document.getElementById('ripple-canvas');
  var splash = document.querySelector('.splash');
  var spotlight = document.getElementById('splash-spotlight');
  var logoWrap = document.querySelector('.splash-logo-wrap');
  if (!canvas || !canvas.getContext || !splash) return;

  var ctx = canvas.getContext('2d', { alpha: true });
  var host = canvas.parentElement;
  var w = 0, h = 0;
  var t = 0;

  // --- liquid ripple simulation (height-field water effect) ---
  var CELL = 12; // px per grid cell — small enough to look smooth once upscaled by the browser
  var cols = 0, rows = 0;
  var bufA = null, bufB = null; // ping-pong height buffers
  var imgData = null;
  var damping = 0.925;

  function buildGrid() {
    cols = Math.max(2, Math.ceil(w / CELL));
    rows = Math.max(2, Math.ceil(h / CELL));
    canvas.width = cols;
    canvas.height = rows;
    bufA = new Float32Array(cols * rows);
    bufB = new Float32Array(cols * rows);
    imgData = ctx.createImageData(cols, rows);
  }

  function splashAt(px2, py2, strength) {
    var gx = Math.round((px2 / w) * cols);
    var gy = Math.round((py2 / h) * rows);
    for (var oy = -1; oy <= 1; oy++) {
      for (var ox = -1; ox <= 1; ox++) {
        var x = gx + ox, y = gy + oy;
        if (x > 0 && x < cols - 1 && y > 0 && y < rows - 1) {
          bufA[y * cols + x] += strength * (ox === 0 && oy === 0 ? 1 : 0.45);
        }
      }
    }
  }

  function stepSimulation() {
    for (var y = 1; y < rows - 1; y++) {
      var rowOff = y * cols;
      for (var x = 1; x < cols - 1; x++) {
        var i = rowOff + x;
        bufB[i] = (bufA[i - 1] + bufA[i + 1] + bufA[i - cols] + bufA[i + cols]) / 2 - bufB[i];
        bufB[i] *= damping;
        if (bufB[i] < 0.04 && bufB[i] > -0.04) { bufB[i] = 0; }
      }
    }
    var tmp = bufA; bufA = bufB; bufB = tmp;
  }

  function renderRipple() {
    var data = imgData.data;
    for (var i = 0, n = cols * rows; i < n; i++) {
      var val = bufA[i];
      var t2 = val * 0.065;
      if (t2 > 1) t2 = 1; if (t2 < -1) t2 = -1;
      var p = i * 4;
      if (t2 >= 0) {
        data[p] = 255; data[p + 1] = 214; data[p + 2] = 170;
        data[p + 3] = Math.round(t2 * 170);
      } else {
        data[p] = 111; data[p + 1] = 61; data[p + 2] = 30;
        data[p + 3] = Math.round(-t2 * 170);
      }
    }
    imgData.data.set(data);
    ctx.putImageData(imgData, 0, 0);
  }

  // smoothed pointer position (always a valid point) + hover intensity (0..1)
  var px = 0, py = 0, targetPx = 0, targetPy = 0;
  var intensity = 0, targetIntensity = 0;
  var hovering = false;
  var lastInjectX = null, lastInjectY = null;
  var idleTimer = 90;
  var logoCenterX = 0, logoCenterY = 0;

  function resize() {
    w = host.offsetWidth;
    h = host.offsetHeight;
    buildGrid();
    px = targetPx = w / 2;
    py = targetPy = h / 2;
    if (logoWrap) {
      var lRect = logoWrap.getBoundingClientRect();
      var hRect = host.getBoundingClientRect();
      logoCenterX = lRect.left - hRect.left + lRect.width / 2;
      logoCenterY = lRect.top - hRect.top + lRect.height / 2;
    }
  }
  resize();
  window.addEventListener('resize', resize);

  function setPointer(clientX, clientY) {
    var rect = host.getBoundingClientRect();
    targetPx = clientX - rect.left;
    targetPy = clientY - rect.top;
    targetIntensity = 1;
    hovering = true;
    // inject a ripple as the pointer travels, proportional to how far it moved
    if (lastInjectX !== null) {
      var d = Math.hypot(targetPx - lastInjectX, targetPy - lastInjectY);
      if (d > 6) { splashAt(targetPx, targetPy, Math.min(10, 2.5 + d * 0.08)); lastInjectX = targetPx; lastInjectY = targetPy; }
    } else {
      splashAt(targetPx, targetPy, 4);
      lastInjectX = targetPx; lastInjectY = targetPy;
    }
  }
  host.addEventListener('mousemove', function (e) { setPointer(e.clientX, e.clientY); });
  host.addEventListener('mouseleave', function () { targetIntensity = 0; hovering = false; lastInjectX = null; });
  host.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches[0]) { setPointer(e.touches[0].clientX, e.touches[0].clientY); }
  }, { passive: true });
  host.addEventListener('touchend', function () { targetIntensity = 0; hovering = false; lastInjectX = null; });

  function frame() {
    t += 0.014;

    // idle autonomous drift when not hovering, plus a gentle ambient "raindrop" now and then
    if (!hovering) {
      targetPx = w / 2 + Math.cos(t * 0.35) * w * 0.32;
      targetPy = h / 2 + Math.sin(t * 0.5) * h * 0.26;
      idleTimer -= 1;
      if (idleTimer <= 0) {
        splashAt(Math.random() * w, Math.random() * h, 3 + Math.random() * 2);
        idleTimer = 220 + Math.random() * 180;
      }
    }
    px += (targetPx - px) * 0.06;
    py += (targetPy - py) * 0.06;
    intensity += (targetIntensity - intensity) * 0.05;

    // --- animation 1: liquid ripple field ---
    stepSimulation();
    renderRipple();

    // --- animation 2: cursor / sweeping spotlight glow ---
    if (spotlight) {
      spotlight.style.setProperty('--mx', px + 'px');
      spotlight.style.setProperty('--my', py + 'px');
      spotlight.style.setProperty('--spot-o', (0.22 + intensity * 0.55).toFixed(3));
    }

    // --- animation 3: logo sway + magnetic tilt toward pointer ---
    if (logoWrap) {
      var swayX = Math.sin(t * 0.6) * 5;
      var swayY = Math.cos(t * 0.5) * 3;
      var ldx = Math.max(-1, Math.min(1, (px - logoCenterX) / 260));
      var ldy = Math.max(-1, Math.min(1, (py - logoCenterY) / 260));
      var tiltX = (swayY * (1 - intensity) - ldy * 16 * intensity).toFixed(2);
      var tiltY = (swayX * (1 - intensity) + ldx * 16 * intensity).toFixed(2);
      var scale = (1 + 0.06 * intensity).toFixed(3);
      logoWrap.style.transform = 'perspective(700px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) scale(' + scale + ')';
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

</script>
</body>
</html>
